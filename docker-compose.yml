# DCA Bot
# All secrets live in .env — never hardcoded here.
# screenshot-service is internal only (no external port).

services:

  freqtrade:
    image: freqtradeorg/freqtrade:stable
    container_name: DCA_freqtrade
    restart: unless-stopped
    ports:
      - "8201:8080"              # Freqtrade UI — accessible on local network
    volumes:
      - ./user_data:/freqtrade/user_data
    networks:
      - internal
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      --strategy DCAStrategy

  dca-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: DCA_bot
    restart: unless-stopped
    ports:
      - "8200:5000"              # Webhook + dashboard — accessible on local network
    volumes:
      - ./data:/data              # Persists the buy log database
    env_file: .env
    environment:
      - FREQTRADE_API=http://freqtrade:8080/api/v1
      - SCREENSHOT_URL=http://screenshot-service:5001
      - DB_PATH=/data/dca_bot.db
    networks:
      - internal
    depends_on:
      - freqtrade
      - screenshot-service

  screenshot-service:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    container_name: DCA_screenshot
    restart: unless-stopped
    # No external ports — only reachable from dca-bot inside Docker network
    env_file: .env
    networks:
      - internal

networks:
  internal:
    driver: bridge
